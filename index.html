<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Planner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <main class="container py-4" style="max-width: 560px;">
    <h1 class="h2 mb-3">Daily Planner</h1>

    <ul class="nav nav-tabs mb-3" role="tablist" aria-label="Sections">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="tab-today" role="tab" aria-selected="true" aria-controls="today">Today</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tab-add" role="tab" aria-selected="false" aria-controls="add">Add Task</button>
      </li>
    </ul>

    <section role="tabpanel" id="today" aria-labelledby="tab-today">
      <p id="empty" class="text-body-secondary">No tasks yet.</p>
      <ul id="list" class="list-group"></ul>
    </section>

    <section role="tabpanel" id="add" aria-labelledby="tab-add" hidden>
      <form id="form" novalidate>
        <div class="mb-3">
          <label for="text" class="form-label">Task</label>
          <input type="text" class="form-control" id="text" maxlength="80">
        </div>
        <div class="mb-3">
          <label for="time" class="form-label">Time (optional)</label>
          <input type="time" class="form-control" id="time">
        </div>
        <div class="text-danger mb-2" id="error" role="alert"></div>
        <button type="submit" class="btn btn-primary">Add</button>
      </form>
    </section>
  </main>

  <script src="js/scripts.js"></script>
</body>
</html>
